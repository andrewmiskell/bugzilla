name: Native AMD64 image test

on:
  push:
    branches:
      - test/ubuntu-26.04-amd64-ci

permissions:
  contents: read

jobs:
  image-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runner architecture
        run: test "$(uname -m)" = x86_64
      - name: Build application and database images
        run: |
          docker compose build
          image="$(docker compose config --images | grep 'bugzilla5.web$')"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
      - name: Check Bugzilla modules
        run: docker compose run --rm --no-deps --entrypoint /bin/bash bugzilla5.web -c 'perl checksetup.pl --check-modules'
      - name: Start Bugzilla
        run: |
          docker compose up -d
          for i in $(seq 1 120); do
            if docker compose logs --no-color bugzilla5.web | grep -q 'Checksetup completed\.'; then
              exit 0
            fi
            if [ "$(docker inspect "$(docker compose ps -aq bugzilla5.web)" --format '{{.State.Running}}')" != true ]; then
              docker compose logs --no-color bugzilla5.web
              exit 1
            fi
            sleep 3
          done
          docker compose logs --no-color
          exit 1
      - name: Check HTTP and database TLS
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused --fail --silent --show-error -o /dev/null http://127.0.0.1:8080/
          docker compose exec -T bugzilla5.web perl -I. -MBugzilla -e '
            my $row = Bugzilla->dbh->selectrow_arrayref("SHOW SESSION STATUS LIKE ?", undef, "Ssl_cipher");
            die "Database connection is not encrypted\n" unless $row->[1];
            print "Database TLS cipher: $row->[1]\n";
          '
      - name: Remove test containers
        if: always()
        run: docker compose down --volumes --remove-orphans
